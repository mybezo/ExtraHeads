name: Bug Report
description: Report a bug or problem with ExtraHeads
labels: ["bug"]
assignees:
  - ybw0014
body:
  - type: markdown
    attributes:
      value: |
        ## Welcome to the ExtraHeads issue tracker
        You are reporting a bug in **ExtraHeads**.
        For questions, ideas or general feedback, please use the [Slimefun Discord](https://discord.gg/fsD4Bkh) instead.
        We recommend reading [How to report bugs](https://github.com/Slimefun/Slimefun4/wiki/How-to-report-bugs) first.

        <strong><i>Fields marked with an asterisk (*) are required.</i></strong>

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Before reporting, please confirm that
      options:
        - label: I am using an official build (see the download link in the README)
          required: true
        - label: I have not modified the downloaded file in any way
          required: true
        - label: I have searched the [existing issues](../issues) and did not find the same problem
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Describe the problem in detail.
        The more information you give, the faster we can fix it.
      placeholder: '"It does not work" does not help us find the problem.'
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Explain step by step how to reproduce the problem.
        If you have a video, add a link to it here.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: |
        What did you expect to happen?
        Sometimes a "bug" is just a misunderstanding of how a feature works.
    validations:
      required: true

  - type: input
    id: server-log
    attributes:
      label: Server log
      description: |
        Check your server log for errors. If there are any, upload the log to [https://mclo.gs](https://mclo.gs) and paste the link here.
        **Do not paste the log directly into this field.**
      placeholder: https://mclo.gs/...
    validations:
      required: false

  - type: input
    id: error-report
    attributes:
      label: Error report
      description: |
        If the log mentions a file in `/plugins/Slimefun/error-reports`, upload that file to [https://mclo.gs](https://mclo.gs) and paste the link here.
        **Do not paste the error report directly into this field.**
      placeholder: https://mclo.gs/...
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Run `/sf versions` in game and paste or screenshot the **full output** here.
        If the command does not work, list your server software, Minecraft version, Slimefun version, ExtraHeads version and plugin list manually.
        If your client's Minecraft version differs from the server's, please mention it too.
      placeholder: |
        (Paste the full output of /sf versions here, or fill it in manually)
    validations:
      required: true
